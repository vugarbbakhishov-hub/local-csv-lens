name: Usability feedback
description: Share what worked or what made a CSV inspection difficult.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Local CSV Lens. This is a public GitHub issue.
        Use fictional examples only. Do not include your original CSV, report, or private data.
        New here? Try the [sample walkthrough](https://github.com/vugarbbakhishov-hub/local-csv-lens/blob/main/docs/try-it.md).
  - type: dropdown
    id: example
    attributes:
      label: Which example did you try?
      options:
        - Built-in sample
        - quality-check.csv
        - type-check.csv
        - Malformed-quote recovery example
        - My own fictional CSV
        - Another task
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to check?
      description: Describe the task without sharing the data itself.
      placeholder: I wanted to find missing scores before importing a table.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Did you complete the task?
      options:
        - "Yes"
        - Partly
        - "No"
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked, and what was confusing?
      description: Mention the step or result that helped or blocked you. Suggestions are welcome.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox on Windows, Safari on iPhone
  - type: textarea
    id: result_difference
    attributes:
      label: Did any result differ from the walkthrough?
      description: Optional. Name the metric or column, its expected result and what the app showed. If everything matched, say so. Do not paste private data.
      placeholder: "quality-check.csv: expected 67% completeness; the app showed ..."
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included private data and understand this feedback will be public.
          required: true
