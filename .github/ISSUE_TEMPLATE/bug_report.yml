name: Bug report
description: Report CSV input that produces an incorrect result or interface problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Local CSV Lens. Remove private or sensitive data from every example.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal CSV sample
      description: For parsing problems, name a downloadable example (quality-check.csv or type-check.csv) or provide the smallest fictional CSV that reproduces the problem. A CSV sample is optional for interface problems.
      render: csv
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Mention whether you pasted text or opened a file, which buttons you used, and whether refreshing changes the result.
      placeholder: "1. Open type-check.csv using Choose a CSV file.\n2. Edit a value.\n3. Click Analyze data."
    validations:
      required: true
  - type: dropdown
    id: delimiter
    attributes:
      label: Delimiter
      options:
        - Comma
        - Semicolon
        - Tab
        - Unsure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 142, Safari 18
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, financial, health and customer data from the sample.
          required: true
