name: Bug report
description: Report CSV input that produces an incorrect result or interface problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Local CSV Lens. Remove private or sensitive data from every example.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal CSV sample
      description: For parsing problems, provide the smallest fictional CSV that reproduces the problem. For interface problems, describe the steps instead; a CSV sample is optional.
      render: csv
    validations:
      required: false
  - type: dropdown
    id: delimiter
    attributes:
      label: Delimiter
      options:
        - Comma
        - Semicolon
        - Tab
        - Unsure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 142, Safari 18
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, financial, health and customer data from the sample.
          required: true
